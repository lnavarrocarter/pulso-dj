# Builds the Windows installer and the Linux AppImage and .deb on their own systems, after the unit and Electron
# tests pass there. A tag "vX.Y.Z" publishes them as a prerelease with docs/RELEASE_NOTES_X.Y.Z.md; a manual run
# only builds them and keeps them as workflow artifacts.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: --win nsis
          - os: ubuntu-latest
            targets: --linux AppImage deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Prepare yt-dlp (official binary, SHA-256 checked)
        run: node desktop/prepare-tools.cjs
      - name: Electron test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run test:desktop
      - name: Electron test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - run: npx electron-builder ${{ matrix.targets }} --publish never
      - name: Checksums
        shell: bash
        run: cd release && sha256sum Pulso-DJ-*.exe Pulso-DJ-*.AppImage Pulso-DJ-*.deb 2>/dev/null > SHA256SUMS-${{ runner.os }}.txt; cat SHA256SUMS-${{ runner.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pulso-dj-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/Pulso-DJ-*.exe
            release/Pulso-DJ-*.AppImage
            release/Pulso-DJ-*.deb
            release/SHA256SUMS-*.txt
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt && rm dist/SHA256SUMS-*.txt
          gh release create "$GITHUB_REF_NAME" dist/* --prerelease --title "Pulso DJ $version" --notes-file "docs/RELEASE_NOTES_${version}.md"
